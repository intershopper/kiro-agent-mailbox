[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiro-agent-mailbox"
version = "0.1.0"
description = "MCP Server fuer Cross-Session-Messaging zwischen gleichzeitig laufenden Kiro-CLI-Sessions (oder anderen MCP-Clients) auf derselben Maschine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Frank Schaellert", email = "intershopper@gmx.de"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
agent-mailbox-mcp = "kiro_agent_mailbox.server:main"

[project.urls]
Homepage = "https://github.com/intershopper/kiro-agent-mailbox"
Repository = "https://github.com/intershopper/kiro-agent-mailbox"

[tool.hatch.build.targets.wheel]
packages = ["src/kiro_agent_mailbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
